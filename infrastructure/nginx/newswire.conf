# Nginx alternative to Caddy (bring your own certificate, e.g. certbot).
# Assumes the API listens on 127.0.0.1:8000 and the web UI on 127.0.0.1:3000.
server {
    listen 80;
    server_name news.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name news.example.org;

    ssl_certificate     /etc/letsencrypt/live/news.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/news.example.org/privkey.pem;

    client_max_body_size 20m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # The browser uploads videos in 8 MB pieces (/api/v1/videos/uploads/...), which the 20m limit
    # above already allows. This block is only for scripts that POST a whole file to /api/v1/videos;
    # it is streamed to the API unbuffered. Keep the size in step with NEWSWIRE_MAX_VIDEO_BYTES.
    location = /api/v1/videos {
        client_max_body_size 1100m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
    location /media/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
